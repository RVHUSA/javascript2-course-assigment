<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social Feed</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/feed.css">
  <link rel="stylesheet" href="../css/post.css">
</head>
<body>
  <header>
    <a href="/html/feed.html" class="logo">MySocial</a>
    <nav>
      <a href="/html/feed.html">Home</a>
      <a href="/html/profile.html">Profile</a>
    </nav>
    <nav class="right-nav">
      <a href="/html/login.html" id="logoutLink">Logout</a>
    </nav>
  </header>
  <main>
    <form id="postForm">
      <input type="text" id="title" placeholder="Post title" required>
      <textarea id="body" placeholder="Write something..." required></textarea>
      <input type="text" id="imageUrl" placeholder="Image URL (optional)">
      <button type="submit">Create Post</button>
    </form>
    <div class="search-bar">
      <input type="text" id="postSearch" placeholder="Search posts...">
      <button id="searchBtn">Search</button>
    </div>
    <div id="feedContainer" class="feed-container"></div>
  </main>
  <script type="module" src="../main-feed.ts"></script>
</body>
</html>
